name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: NUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore tests
        run: dotnet restore tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj
      - name: Build tests
        run: dotnet build tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj -c Release --no-restore
      - name: NUnit and TRX
        run: dotnet test tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/trx
      - name: Verify TRX contains passed tests
        run: python tools/check_trx.py artifacts/trx/tests.trx
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/trx/*.trx
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    name: Windows WinUI + NuGet smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Restore Windows library
        run: dotnet restore src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj
      - name: Build Windows library
        run: dotnet build src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj -c Release --no-restore
      - name: Compile Windows MAUI consumer against both assemblies
        shell: pwsh
        run: |
          dotnet restore tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -p:TargetFramework=net10.0-windows10.0.19041.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack both NuGet packages (without publishing)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nuget | Out-Null
          dotnet pack src/Laveyana.Maui.UI/Laveyana.Maui.UI.csproj -c Release --no-build -o artifacts/nuget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj -c Release --no-build -o artifacts/nuget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-ChildItem artifacts/nuget/*.nupkg).Count -ne 2) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-candidates
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14
