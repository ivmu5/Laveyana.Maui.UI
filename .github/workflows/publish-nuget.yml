name: Publish NuGet

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release, test and pack
    if: github.repository == 'ivmu5/Laveyana.Maui.UI'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag and origin
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/check_version.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p test_versioning.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release does not exist' }
          if ($release.isDraft -or $release.tagName -ne $env:RELEASE_TAG) { throw 'Invalid release state' }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.LaveyanaVersion
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release/version mismatch' }
          if ([int]($version.Split('.')[0]) -eq 0 -and -not $release.isPrerelease) {
            throw 'Major zero releases must be marked as GitHub prerelease'
          }
          git fetch origin master --no-tags
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not on master' }
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Execute NUnit and check report
        shell: pwsh
        run: |
          dotnet restore tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=release.trx" --results-directory artifacts/trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_trx.py artifacts/trx/release.trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows assemblies and MAUI consumer
        shell: pwsh
        run: |
          dotnet restore src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -p:SmokeTargetFramework=net10.0-windows10.0.19041.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -c Release -p:SmokeTargetFramework=net10.0-windows10.0.19041.0 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create exactly two NuGet packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nuget | Out-Null
          foreach ($name in @('Laveyana.Maui.UI', 'Laveyana.Maui.UI.Windows')) {
            dotnet pack "src/$name/$name.csproj" -c Release --no-build -o artifacts/nuget
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          [xml]$props = Get-Content Directory.Build.props
          $normalized = (($props.Project.PropertyGroup.LaveyanaVersion.Split('.') | ForEach-Object { [int]$_ }) -join '.')
          if (@(Get-ChildItem artifacts/nuget -Filter '*.nupkg').Count -ne 2) { throw 'Expected exactly two packages' }
          foreach ($name in @('Laveyana.Maui.UI', 'Laveyana.Maui.UI.Windows')) {
            if (-not (Test-Path "artifacts/nuget/$name.$normalized.nupkg")) { throw "Missing NuGet package $name.$normalized" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: validated-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

  prepare-android:
    name: Build and pack Android
    if: github.repository == 'ivmu5/Laveyana.Maui.UI'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - run: dotnet workload install android maui-android --skip-manifest-update
      - run: dotnet build tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -c Release -p:SmokeTargetFramework=net10.0-android
      - run: dotnet pack src/Laveyana.Maui.UI.Android/Laveyana.Maui.UI.Android.csproj -c Release -o artifacts/android
      - uses: actions/upload-artifact@v4
        with:
          name: validated-android-package
          path: artifacts/android/*.nupkg
          if-no-files-found: error

  publish:
    name: NuGet Trusted Publishing
    needs: [prepare, prepare-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: validated-android-package
          path: packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - name: Validate NuGet publisher settings
        shell: bash
        env:
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$NUGET_USERNAME"
          test "$(find packages -name '*.nupkg' | wc -l)" -eq 3
      - name: Obtain short-lived NuGet API key (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish core first and platform packages second
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          IFS='.' read -r major year month revision <<< "$version"
          normalized="$((10#$major)).$((10#$year)).$((10#$month)).$((10#$revision))"
          for name in Laveyana.Maui.UI Laveyana.Maui.UI.Windows Laveyana.Maui.UI.Android; do
            package="packages/$name.$normalized.nupkg"
            test -f "$package"
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
