name: Publish NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release, NUnit, pack
    if: github.repository == 'ivmu5/Laveyana.Maui.UI'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag against version and master
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.LaveyanaVersion
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag/version mismatch: $env:RELEASE_TAG vs v$version" }
          if ([int]($version.Split('.')[0]) -eq 0 -and $env:PRERELEASE -ne 'true') { throw 'Global version 0 must be marked as Pre-release on GitHub' }
          git fetch origin master --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not on master' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version scheme and release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/check_version.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p test_versioning.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet restore tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj
      - run: dotnet test tests/Laveyana.Maui.UI.Tests/Laveyana.Maui.UI.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=release.trx" --results-directory artifacts/trx
      - name: Check release NUnit report
        run: python tools/check_trx.py artifacts/trx/release.trx
      - run: dotnet restore src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj
      - run: dotnet build src/Laveyana.Maui.UI.Windows/Laveyana.Maui.UI.Windows.csproj -c Release --no-restore
      - name: Compile Windows MAUI consumer against both assemblies
        shell: pwsh
        run: |
          dotnet restore tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -p:SmokeTargetFramework=net10.0-windows10.0.19041.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Laveyana.Maui.UI.Smoke/Laveyana.Maui.UI.Smoke.csproj -c Release -p:SmokeTargetFramework=net10.0-windows10.0.19041.0 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack exactly two libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nuget | Out-Null
          foreach ($name in @('Laveyana.Maui.UI', 'Laveyana.Maui.UI.Windows')) {
            dotnet pack "src/$name/$name.csproj" -c Release --no-build -o artifacts/nuget
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ((Get-ChildItem artifacts/nuget/*.nupkg).Count -ne 2) { throw 'Exactly 2 packages required' }
          [xml]$props = Get-Content Directory.Build.props
          $normalizedVersion = (($props.Project.PropertyGroup.LaveyanaVersion.Split('.') | ForEach-Object { [int]$_ }) -join '.')
          foreach ($name in @('Laveyana.Maui.UI', 'Laveyana.Maui.UI.Windows')) {
            if (-not (Test-Path "artifacts/nuget/$name.$normalizedVersion.nupkg")) { throw "Missing normalized package for $name, version $normalizedVersion" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: validated-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: NuGet.org (OIDC Trusted Publishing)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-packages
          path: packages
      - name: Validate NuGet login configuration
        shell: bash
        env:
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
        run: test -n "$NUGET_USERNAME" && test "$(find packages -name '*.nupkg' | wc -l)" -eq 2
      - name: Authenticate with short-lived token
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish core first, Windows second
        shell: bash
        env:
          VERSION_TAG: ${{ github.event.release.tag_name }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # NuGet normalizes a leading zero in the month: 01 -> 1.
          version="${VERSION_TAG#v}"
          IFS='.' read -r major year month revision <<< "$version"
          normalized_version="$((10#$major)).$((10#$year)).$((10#$month)).$((10#$revision))"
          for name in Laveyana.Maui.UI Laveyana.Maui.UI.Windows; do
            package="packages/$name.$normalized_version.nupkg"
            test -f "$package"
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
) { throw 'Invalid v.YY.MM.vv release tag' }
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.LaveyanaVersion
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag/version mismatch: $env:RELEASE_TAG vs v$version" }
          if ([int]($version.Split('.')[0]) -eq 0 -and $env:PRERELEASE -ne 'true') { throw 'Global version 0 must be marked as Pre-release on GitHub' }
          git fetch origin master --no-tags
